name: Publish release (tag)

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: PRODUCTION
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ngthuc/gh-actions-templates/actions/publish-npm@v1
        with:
          version-mode: tag
          require-ancestor-branch: master
          build-kind: prod
          run-tests: 'false'
