name: Publish

# Trusted Publishing on npmjs.com must be configured with this exact
# workflow filename (publish.yml) for ngthuc/kill-process.
on:
  push:
    branches: [develop, master]
    tags: ['v*']
  pull_request:
    branches: [develop, master]

jobs:
  publish-dev:
    # Push/PR to develop -> 1.0.0-dev-<commit hash>
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'pull_request' && github.base_ref == 'develop' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ngthuc/gh-actions-templates/actions/publish-npm@v1
        with:
          version-mode: short-sha
          version-prefix: 1.0.0-dev
          npm-dist-tag: dev
          build-kind: dev
          run-tests: 'true'

  publish-rc:
    # Push/PR to master -> 1.0.0-rc-<commit hash>
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' && github.base_ref == 'master' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ngthuc/gh-actions-templates/actions/publish-npm@v1
        with:
          version-mode: short-sha
          version-prefix: 1.0.0-rc
          npm-dist-tag: rc
          build-kind: prod
          run-tests: 'true'

  publish-release:
    # Tag vX.Y.Z on master -> X.Y.Z
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ngthuc/gh-actions-templates/actions/publish-npm@v1
        with:
          version-mode: tag
          tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
          require-ancestor-branch: master
          build-kind: prod
          run-tests: 'true'
