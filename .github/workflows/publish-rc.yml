name: Publish release-candidate build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.gitnexus/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'
      - 'logo.png'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.gitnexus/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'
      - 'logo.png'

concurrency:
  group: publish-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Pull requests from forks cannot get an OIDC token, so skip them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: STAGING
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ngthuc/gh-actions-templates/actions/publish-npm@v1
        with:
          version-mode: short-sha
          version-prefix: 1.0.0-rc
          npm-dist-tag: rc
          build-kind: dev
          run-tests: 'true'
