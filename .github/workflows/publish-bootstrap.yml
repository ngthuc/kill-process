name: Bootstrap first publish (temporary)

# One-off workflow to create the package on npm so a Trusted Publisher can be
# attached to it. Uses a temporary NPM_TOKEN secret instead of OIDC.
# After the first publish: add the Trusted Publishers on npmjs.com, then
# delete the NPM_TOKEN secret, revoke the token, and delete this file.

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ngthuc/gh-actions-templates/actions/publish-npm@v1
        with:
          version-mode: short-sha
          version-prefix: 1.0.0-dev
          npm-dist-tag: dev
          build-kind: dev
          run-tests: 'true'
